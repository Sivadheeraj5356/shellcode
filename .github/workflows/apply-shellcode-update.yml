name: apply shellcode update
on:
  push:
    paths: ["shellcode-src.tgz"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tar xzf shellcode-src.tgz
          rm shellcode-src.tgz
          git config user.name "Siva Dheeraj"
          git config user.email "Sivadheeraj5356@users.noreply.github.com"
          git add -A
          git commit -m "Multi-harness coding workspace: router, built-in agent, harness adapters, terminal UI, sessions"
          git push
