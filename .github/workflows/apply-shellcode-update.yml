name: apply shellcode update
on:
  push:
    paths: ["shellcode-payload.b64"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d shellcode-payload.b64 | tar xz
          rm shellcode-payload.b64
          git config user.name "Siva Dheeraj"
          git config user.email "Sivadheeraj5356@users.noreply.github.com"
          git add -A
          git commit -m "Streaming output fix, router diagnosis signal, local-run docs"
          git push
